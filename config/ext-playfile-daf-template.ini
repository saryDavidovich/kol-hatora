; ===================================================================
; תבנית ext.ini לתיקיית עמוד גמרא בודדת (מסכת/דף/עמוד)
; ה-pipeline (pipeline/uploadToYemot.js) מייצר ומעלה קובץ כזה אוטומטית
; לכל תיקייה שנוצרת, יחד עם שלושת קבצי האודיו: gemara.wav / rashi.wav / tosafot.wav
;
; הערה: הקבצים בתיקייה זו הם קבצים "בעלי שם" (לא ממוספרים 000/001),
; ולכן מנגנון "ההשמעה הרציפה" הרגיל של playfile לא ינסה לעבור ביניהם
; אוטומטית - הכניסה לקובץ הספציפי תמיד נעשית ע"י go_to_folder_and_play
; משרת ה-API שלנו, שמציין איזה קובץ להשמיע ומאיזו נקודה.
; ===================================================================

type=playfile

; נדרש כדי שפקדי minus/plus (מהירות, דילוג בזמן) יעבדו בלי צורך
; במצב "מנהל מחובר" - בלעדיו חלק מהמקשים האלה פשוט לא מגיבים
listening_mark_no_check_for_key_options=minus,plus

; --- פקדי ניווט תוך כדי השמעה (נייטיביים לגמרי בימות, ללא צורך בשרת) ---

; מקש 1: 5 שניות אחורה
control_play1=seconds_minus
seconds_minus_amount=5000

; מקש 3: 5 שניות קדימה
control_play3=seconds_plus
seconds_plus_amount=5000

; מקש 4: 3 דקות אחורה
control_play4=minut_minus
minut_minus_amount1=180000

; מקש 6: 3 דקות קדימה
control_play6=minut_plus
minut_plus_amount1=180000

; מקש 7: האטת קצב הדיבור
control_play7=change_playback_speed_minus

; מקש 9: האצת קצב הדיבור
control_play9=change_playback_speed_plus
save_change_speed=yes

; מקש 5: עצירה/ביטול עצירה (Pause) - עד 10 דקות המתנה
control_play5=wait
control_play_wait_time_max=600
control_play_wait_time_minus=0

; --- פקדים הדורשים שרת (send_api) - כל מקש פועל מיד, בלי תת-תפריט
; (בדיקה בפועל הראתה שבקשת read נוספת מתוך send_api בתוך playfile
; לא נתמכת אמינה - לכן כל פעולה כאן היא מיידית ועצמאית) ---

; מקש 2: מעבר לתפריט מפרשים (רש"י/תוספות) - ניתוב נייטיבי (בלי שרת!)
; לשלוחת type=api משותפת אחת לכל המערכת, שמשתמשת במנגנון read שכבר
; הוכח כעובד מצוין (בניגוד ל-read בתוך send_api מתוך playfile, שלא
; עבד באמינות בבדיקות בפועל). יש להתאים את המספר לשלוחה שהקצתם.
control_play2=go_to_folder
playfile_control_play_2_goto=/21

; מקש 8: מעבר מיידי לדף הבא (מתחיל את הגמרא מההתחלה)
control_play8=send_api

; מקש *: מעבר מיידי לדף הקודם (מתחיל את הגמרא מההתחלה)
control_play*=send_api

; --- הגדרות ה-API ---
api_link=https://kol-hatora-production.up.railway.app/api/player/control
api_url_post=yes

; --- לאחר סיום הקובץ (אין קובץ "הבא" ממוספר) חוזרים לתפריט הקודם ---
after_play=return
