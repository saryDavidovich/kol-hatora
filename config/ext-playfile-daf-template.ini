type=playfile
listening_mark_no_check_for_key_options=minus,plus

; --- פקדים נייטיביים (לא דורשים שרת) ---
control_play1=seconds_minus
seconds_minus_amount=5000
control_play3=seconds_plus
seconds_plus_amount=5000
control_play4=minut_minus
minut_minus_amount1=180000
control_play6=minut_plus
minut_plus_amount1=180000
control_play7=change_playback_speed_minus
control_play9=change_playback_speed_plus
save_change_speed=yes
control_play5=wait
control_play_wait_time_max=600

; --- פקדים הדורשים שרת (send_api) ---
control_play8=send_api
control_play#=send_api

; --- תפריט מפרשים - דרך "תפריט אפשרויות נוספות" הילידי של ימות ---
; מקש * (ברירת המחדל) פותח תפריט מובנה בתוך ימות עצמו, ורק הבחירה
; הסופית שולחת send_api - זו תבנית מוכחת (לא read מותאם אישית, שנכשל
; בבדיקות קודמות).
control_play_moreA1=send_api
control_play_moreA2=send_api
control_play_moreA8=send_api

api_link=https://YOUR-SERVER-DOMAIN.example.com/api/player/control
api_url_post=yes
