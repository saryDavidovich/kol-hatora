; ===================================================================
; קובץ הגדרות (ext.ini) לשלוחה הראשית של המערכת - תפריט הניווט
; יש להעלות קובץ זה לשלוחה שתבחרו כשלוחה הראשית (למשל שלוחה 1)
; ===================================================================

type=api

; כתובת השרת שבניתם (server/index.js) - להחליף לכתובת האמיתית שלכם
api_link=https://kol-hatora-production.up.railway.app/api/ivr/main

; שליחה ב-POST (מומלץ, כדי לא לחשוף פרמטרים ב-URL/לוגים)
api_url_post=yes

; מוזיקת המתנה בזמן שהשרת מעבד את הבקשה (חוויית משתמש טובה יותר)
api_wait_answer_music_on_hold=yes

; אם השרת לא זמין / לא עונה - חוזרים לתפריט הראשי של ימות
api_end_goto=/
