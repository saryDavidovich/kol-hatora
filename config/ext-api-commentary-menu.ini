; ===================================================================
; שלוחת "תפריט מפרשים" משותפת - שלוחה אחת בלבד לכל המערכת (לא לכל
; עמוד בנפרד!). כל עמודי הגמרא מנתבים אליה נייטיבית (control_play2=
; go_to_folder) כשלוחצים 2 תוך כדי השמעה.
;
; למה שלוחה נפרדת ולא send_api ישיר מתוך ה-playfile? כי read= בתוך
; תגובת send_api שמופעלת מתוך playfile לא הוכח כעובד באמינות בבדיקות
; בפועל - לעומת זאת, type=api עם read= (בדיוק כמו בשלוחה הראשית) כן
; הוכח שעובד מצוין. אז אנחנו "יוצאים" מה-playfile נייטיבית (go_to_folder,
; ללא צורך בשרת בכלל בשלב הזה), ורק בשלוחה הזו פונים לשרת.
;
; יש להעלות קובץ זה לשלוחה שהקציתם (למשל 21), ולוודא שהמספר תואם
; למה שכתוב ב-playfile_control_play_2_goto בתבנית של כל עמוד.
; ===================================================================

type=api
api_link=https://kol-hatora-production.up.railway.app/api/commentary-menu
api_url_post=yes

; אם השרת לא עונה - חוזרים שלב אחורה (לעמוד הגמרא שהמאזין בא ממנו)
api_end_goto=..
